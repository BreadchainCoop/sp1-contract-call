[package]
name = "gas-killer-primitives"
description = "Shared types and trace processing for the Gas Killer challenger program"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# workspace
sp1-cc-client-executor = { path = "../../../crates/client-executor" }

# gas-killer (pinned to the revision used by gas-killer/service)
gas-analyzer-core = { git = "https://github.com/gas-killer/gas-analyzer", rev = "3cbd54f802da8c6a25572e42145aedd51cb9a95e" }

# alloy
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
alloy-rpc-types = { workspace = true, features = ["eth", "trace"] }

# misc
eyre.workspace = true
